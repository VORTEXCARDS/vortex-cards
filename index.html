<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1b">
<link rel="manifest" href="/vortex-cards/manifest.webmanifest">
<link rel="icon" href="/vortex-cards/icon-vortex-unit-20261126-v2.svg" type="image/svg+xml">
<link rel="shortcut icon" href="/vortex-cards/icon-vortex-unit-20261126-v2.svg" type="image/svg+xml">
<title>VORTEX UNIT</title>
<script>
(function () {
  function showError(title, details) {
    var box = document.getElementById('vortex-startup-error');
    if (!box) {
      box = document.createElement('pre');
      box.id = 'vortex-startup-error';
      box.style.cssText = 'position:fixed;inset:10px;z-index:999999;overflow:auto;white-space:pre-wrap;background:#170d20;color:#fff;border:2px solid #ff5b75;border-radius:12px;padding:16px;font:14px/1.5 monospace';
      document.addEventListener('DOMContentLoaded', function () {
        if (document.body) document.body.appendChild(box);
      });
      if (document.body) document.body.appendChild(box);
    }
    box.textContent = title + '\n\n' + String(details || 'Подробности ошибки отсутствуют');
  }
  function retryOnce() {
    try {
      if (sessionStorage.getItem('vortex-startup-reload') !== '1') {
        sessionStorage.setItem('vortex-startup-reload', '1');
        location.reload();
        return true;
      }
    } catch (_) {}
    return false;
  }
  window.addEventListener('error', function (event) {
    var target = event.target;
    var failedFile = target && (target.src || target.href);
    if (failedFile && retryOnce()) return;
    showError('ОШИБКА ЗАПУСКА VORTEX UNIT',
      (event.message || 'Не удалось загрузить файл') +
      (failedFile ? '\nФайл: ' + failedFile : '') +
      (event.filename ? '\nФайл: ' + event.filename : '') +
      (event.lineno ? '\nСтрока: ' + event.lineno : '') +
      (event.error && event.error.stack ? '\n\n' + event.error.stack : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (event) {
    showError('ОШИБКА В ПРИЛОЖЕНИИ VORTEX UNIT', event.reason && (event.reason.stack || event.reason.message) || event.reason);
  });
  window.addEventListener('vite:preloadError', function (event) {
    event.preventDefault();
    if (!retryOnce()) showError('НЕ УДАЛОСЬ ЗАГРУЗИТЬ ФАЙЛ ПРИЛОЖЕНИЯ', event.payload || event);
  });
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
